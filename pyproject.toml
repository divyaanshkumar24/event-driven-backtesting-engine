[project]
name = "backtest-engine"
version = "0.1.0"
description = "Event-driven walk-forward backtesting engine with structural look-ahead-bias prevention"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["engine", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
